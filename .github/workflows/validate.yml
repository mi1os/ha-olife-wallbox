name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt

      - name: Create requirements_dev.txt if not exists
        run: |
          if [ ! -f requirements_dev.txt ]; then
            echo "homeassistant==2026.5.4" > requirements_dev.txt
            echo "pre-commit==4.6.0" >> requirements_dev.txt
            echo "pylint==4.0.5" >> requirements_dev.txt
            echo "black==26.5.1" >> requirements_dev.txt
            echo "flake8==7.3.0" >> requirements_dev.txt
            echo "isort==8.0.1" >> requirements_dev.txt
            echo "pymodbus>=3.6.0" >> requirements_dev.txt
            pip install -r requirements_dev.txt
          fi

      - name: Validate with HACS
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands

      - name: Validate with hassfest
        uses: home-assistant/actions/hassfest@master
        
      - name: Lint with flake8
        run: |
          flake8 custom_components/ --count --select=E9,F63,F7,F82 --show-source --statistics 